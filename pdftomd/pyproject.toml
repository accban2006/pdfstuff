[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftomd-desktop"
version = "0.1.0"
description = "Local Vietnamese/English document converter for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "markitdown[pdf,docx]==0.1.8",
  "markdown-it-py==4.2.0",
  "python-docx==1.2.0",
  "fonttools==4.66.1",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.gui-scripts]
pdftomd = "pdftomd.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
